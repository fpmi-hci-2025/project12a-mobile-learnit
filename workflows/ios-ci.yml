name: Simple Build

on: push

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          xcodebuild clean build \
            -project "LearnIt.xcodeproj" \
            -scheme "LearnIt" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO
          
          echo "✅ Готово!"