name: Simple iOS Build

on: push

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build for simulator SDK
        run: |
          echo "🚀 Собираю проект для iOS симулятора..."
          
          # Просто собираем для SDK симулятора без указания конкретного устройства
          xcodebuild clean build \
            -project "LearnIt.xcodeproj" \
            -scheme "LearnIt" \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
          
          echo "✅ Проект успешно скомпилирован!"
